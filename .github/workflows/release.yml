name: Build and Publish GameSpace

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4 Natively
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Sign APK Natively
        id: sign_app
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          # Decode the keystore
          echo "$KEYSTORE_B64" | base64 --decode > keystore.jks
          
          # Dynamically find the latest installed build tools on the runner
          BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          
          # Locate the unaligned/unsigned APK
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # Align the APK
          $BUILD_TOOLS/zipalign -v 4 "$APK_PATH" GameSpace-aligned.apk
          
          # Sign the APK securely
          $BUILD_TOOLS/apksigner sign --ks keystore.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASS --key-pass env:KEY_PASS --out GameSpace-signed.apk GameSpace-aligned.apk
          
          # Export the finalized path to the next step
          echo "signedReleaseFile=GameSpace-signed.apk" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: ${{steps.sign_app.outputs.signedReleaseFile}}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
